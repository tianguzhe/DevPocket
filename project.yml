name: DevPocket
options:
  bundleIdPrefix: com.yikwing
  deploymentTarget:
    macOS: '14.0'
  xcodeVersion: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ''
targets:
  DevPocket:
    type: application
    platform: macOS
    sources: [DevPocket]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yikwing.DevPocket
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DevPocket
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
schemes:
  DevPocket:
    build:
      targets:
        DevPocket: all
    run:
      config: Debug
    archive:
      config: Release
